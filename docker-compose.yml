version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: floodsafe-postgis
    environment:
      POSTGRES_DB: floodsafe
      POSTGRES_USER: floodsafe_user
      POSTGRES_PASSWORD: floodsafe_password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodsafe_user -d floodsafe"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: floodsafe-backend
    environment:
      DATABASE_URL: postgresql+psycopg://floodsafe_user:floodsafe_password@postgis:5432/floodsafe
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgis_data:
