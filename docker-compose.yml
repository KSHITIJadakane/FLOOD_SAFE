version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floodsafe-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: floodsafe-backend
    environment:
      PYTHONPATH: /app
    ports:
      - "8000:8000"

  postgis:
    image: postgis/postgis:16-3.4
    container_name: floodsafe-postgis
    environment:
      POSTGRES_DB: floodsafe
      POSTGRES_USER: floodsafe_user
      POSTGRES_PASSWORD: floodsafe_password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodsafe_user -d floodsafe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
